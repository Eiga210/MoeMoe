<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<title>Desktop Pet</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="drag-region">
    <div id="pet-stage">
      <div id="pet"></div>
    </div>
  </div>

  <div id="stats">
    <div class="bar-row">
      <span class="label">🍰</span>
      <div class="track"><div id="bar-satiety" class="fill"></div></div>
    </div>
    <div class="bar-row">
      <span class="label">😊</span>
      <div class="track"><div id="bar-happiness" class="fill"></div></div>
    </div>
    <div class="bar-row">
      <span class="label">⚡</span>
      <div class="track"><div id="bar-energy" class="fill"></div></div>
    </div>
  </div>

  <div id="controls">
    <button id="btn-feed">🍰</button>
    <button id="btn-play">🦋</button>
    <button id="btn-sleep">😴</button>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
